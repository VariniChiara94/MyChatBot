[project]
name = "chatbot-be"
version = "0.0.1"
description = ""
authors = [
    {name = "Chiara Varini", email = "varinichiara@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi(>=0.115.12,<1.0.0)",
    "uvicorn (>=0.34.0,<1.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "pydantic (>=2.11.1,<3.0.0)",
    "pydantic-settings (>=2.8.1,<3.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "toml (>=2.2.1,<3.0.0) ; python_version < '3.11'",
    "requests (>=2.26.0,<3.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "python-dateutil (>=2.9.0,<3.0.0)",
    "loguru (>=0.7.3,<1.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.0"
pytest-mock = "^3.14.0"
anyio = "^4.9.0"
trio="^0.29.0"
setuptools = "^78.1.0"
build = "^1.2.2"

[build-system]
requires = [
    "setuptools>=78.1.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {"include" = ["chatbot_be"]}